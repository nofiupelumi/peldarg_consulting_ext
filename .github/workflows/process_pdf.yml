name: Process Convocation PDF
on:
  repository_dispatch:
    types: [process_pdf]
concurrency:
  group: process-pdf-${{ github.event.client_payload.doc_id || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACTIVITY_EVENTS_URL: ${{ github.event.client_payload.activity_events_url || 'https://extract.peldargconsulting.com/api/partner/activity-events' }}
  ACTIVITY_EVENTS_PATH: /api/partner/activity-events
  PARTNER_NAME: ${{ github.event.client_payload.partner_name || 'riskcontrol' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.make.outputs.matrix }}
    steps:
      - name: Emit workflow dispatched event (safe-failure)
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          emit_activity() {
            local event_key="$1"; shift
            local sequence="$1"; shift
            local status="$1"; shift
            local phase="$1"; shift
            local timestamp nonce payload signature idem_key
            timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            nonce="$(python - <<'PY'
            import uuid
            print(uuid.uuid4())
            PY
            )"
            idem_key="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${event_key}-${sequence}"
            payload=$(cat <<JSON
            {"partner_request_id":"${REQUEST_ID}","event_key":"${event_key}","sequence":${sequence},"status":"${status}","phase":"${phase}","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"event_at":"${timestamp}"}
            JSON
            )

            if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
              signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
              signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
            else
              signature=""
            fi

            curl -sS -o /tmp/activity_emit.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
              --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
              -H "Content-Type: application/json" \
              -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
              -H "X-Partner-Name: ${PARTNER_NAME}" \
              -H "X-Partner-Timestamp: ${timestamp}" \
              -H "X-Partner-Nonce: ${nonce}" \
              -H "X-Signature-Algorithm: hmac-sha256" \
              -H "Idempotency-Key: ${idem_key}" \
              -H "X-Partner-Signature: ${signature}" \
              -d "${payload}" >/tmp/activity_emit_code.txt || true

            code="$(cat /tmp/activity_emit_code.txt 2>/dev/null || echo '000')"
            echo "[activity] ${event_key} -> HTTP ${code}"
          }

          emit_activity "dispatched" 10 "processing" "processing"
          emit_activity "plan_started" 20 "processing" "planning"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install pdfinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Download source PDF
        run: |
          curl -L "$SOURCE_URL" -o source.pdf
        env:
          SOURCE_URL: ${{ github.event.client_payload.source_url }}
      - name: Probe pages
        id: probe
        run: |
          PAGES=$(pdfinfo source.pdf | awk -F: '/Pages/ {print $2}' | xargs)
          echo "total_pages=$PAGES" >> $GITHUB_OUTPUT
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-pdf
          path: source.pdf
          overwrite: true
      - name: Make matrix
        id: make
        run: |
          python - <<'PY'
          import os, json
          total = int(os.environ['TOTAL'])
          size = int(os.environ.get('SIZE','10'))
          single = (os.environ.get('SINGLE_CHUNK','true').lower() in ('1','true','yes'))
          # Optional page range from payload
          pstart_env = os.environ.get('PAGE_START','').strip()
          pend_env = os.environ.get('PAGE_END','').strip()
          pstart = int(pstart_env) if pstart_env else 1
          pend = int(pend_env) if pend_env else total
          pstart = max(1, pstart)
          pend = min(total, pend)
          if pstart > pend:
              pstart, pend = 1, total
          if single:
              chunks = [{'start': pstart, 'end': pend}]
          else:
              chunks = [{'start': i+1, 'end': min(pend, i+size)} for i in range(pstart-1, pend, size)]
          out = json.dumps(chunks)
          print(out)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+out+'\n')
          PY
        env:
          TOTAL: ${{ steps.probe.outputs.total_pages }}
          SIZE: ${{ github.event.client_payload.chunk_size || 10 }}
          SINGLE_CHUNK: ${{ github.event.client_payload.single_chunk || 'true' }}
          PAGE_START: ${{ github.event.client_payload.page_start }}
          PAGE_END: ${{ github.event.client_payload.page_end }}
      - name: Emit plan completed event (safe-failure)
        if: ${{ success() }}
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          nonce="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          payload=$(cat <<JSON
          {"partner_request_id":"${REQUEST_ID}","event_key":"plan_completed","sequence":30,"status":"processing","phase":"planning_completed","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"event_at":"${timestamp}"}
          JSON
          )
          signature=""
          if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
            signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
            signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
          fi
          curl -sS -o /tmp/activity_emit_plan.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
            --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
            -H "X-Partner-Name: ${PARTNER_NAME}" \
            -H "X-Partner-Timestamp: ${timestamp}" \
            -H "X-Partner-Nonce: ${nonce}" \
            -H "X-Signature-Algorithm: hmac-sha256" \
            -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-plan_completed-30" \
            -H "X-Partner-Signature: ${signature}" \
            -d "${payload}" >/tmp/activity_emit_plan_code.txt || true
          echo "[activity] plan_completed -> HTTP $(cat /tmp/activity_emit_plan_code.txt 2>/dev/null || echo '000')"

  extract:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Emit extract started event (safe-failure)
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          nonce="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          payload=$(cat <<JSON
          {"partner_request_id":"${REQUEST_ID}","event_key":"extract_started","sequence":40,"status":"processing","phase":"extracting","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"event_at":"${timestamp}"}
          JSON
          )
          signature=""
          if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
            signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
            signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
          fi
          curl -sS -o /tmp/activity_emit_extract_start.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
            --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
            -H "X-Partner-Name: ${PARTNER_NAME}" \
            -H "X-Partner-Timestamp: ${timestamp}" \
            -H "X-Partner-Nonce: ${nonce}" \
            -H "X-Signature-Algorithm: hmac-sha256" \
            -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-extract_started-40" \
            -H "X-Partner-Signature: ${signature}" \
            -d "${payload}" >/tmp/activity_emit_extract_start_code.txt || true
          echo "[activity] extract_started -> HTTP $(cat /tmp/activity_emit_extract_start_code.txt 2>/dev/null || echo '000')"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libpoppler-cpp-dev
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download source artifact
        uses: actions/download-artifact@v5
        with:
          name: source-pdf
          path: .
      - name: Resolve Gemini API key by tier
        env:
          API_TIER: ${{ github.event.client_payload.api_tier || 'paid_1' }}
          GEMINI_API_KEY_PAID_1: ${{ secrets.GEMINI_API_KEY_PAID_1 }}
          GEMINI_API_KEY_PAID_2: ${{ secrets.GEMINI_API_KEY_PAID_2 }}
          GEMINI_API_KEY_PAID_3: ${{ secrets.GEMINI_API_KEY_PAID_3 }}
        run: |
          set -euo pipefail
          tier="${API_TIER,,}"
          case "$tier" in
            paid_2)
              key="$GEMINI_API_KEY_PAID_2"
              ;;
            paid_3)
              key="$GEMINI_API_KEY_PAID_3"
              ;;
            *)
              tier="paid_1"
              key="$GEMINI_API_KEY_PAID_1"
              ;;
          esac
          if [ -z "$key" ]; then
            echo "Selected Gemini key is empty for tier: $tier"
            exit 1
          fi
          echo "API_TIER=$tier" >> "$GITHUB_ENV"
          echo "GEMINI_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Extract (agent)
        env:
          SOURCE_FILE: source.pdf
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
          SESSION: ${{ github.event.client_payload.session }}
          GEMINI_API_KEY: ${{ env.GEMINI_API_KEY }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          RESULT_UPLOAD_URL: ${{ github.event.client_payload.result_upload_url }}
          RESULT_UPLOAD_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          CALLBACK_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          # If user provided a specific range, honor it; else extractor will process all pages
          PAGE_START: ${{ github.event.client_payload.page_start }}
          PAGE_END: ${{ github.event.client_payload.page_end }}
          DPI: 300
          MIN_TEXT_WORDS: ${{ github.event.client_payload.min_text_words || 25 }}
        run: |
          # Run the Gemini-based agent extractor; it will create outputs/<base>.csv|xlsx
          python scripts/run_agent.py
          mkdir -p chunks
          # Move and suffix outputs with a page range for compatibility with aggregator
          base="$(basename "${ORIGINAL_FILENAME:-document.pdf}")"; base="${base%.*}"
          start_label="${PAGE_START:-1}"
          end_label="${PAGE_END:-end}"
          shopt -s nullglob
          files=(outputs/"${base}".*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "[extract] No output files found for base: ${base}"
            echo "[extract] outputs/ contains:"
            ls -la outputs || true
            exit 1
          fi
          for f in "${files[@]}"; do
            ext="${f##*.}"
            mv -- "$f" "chunks/${base}-p${start_label}-${end_label}.${ext}"
          done
      - name: Upload chunk artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: chunks/*
      - name: Emit extract completed event (safe-failure)
        if: ${{ success() }}
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          nonce="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          payload=$(cat <<JSON
          {"partner_request_id":"${REQUEST_ID}","event_key":"extract_completed","sequence":50,"status":"processing","phase":"extract_completed","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"event_at":"${timestamp}"}
          JSON
          )
          signature=""
          if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
            signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
            signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
          fi
          curl -sS -o /tmp/activity_emit_extract_done.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
            --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
            -H "X-Partner-Name: ${PARTNER_NAME}" \
            -H "X-Partner-Timestamp: ${timestamp}" \
            -H "X-Partner-Nonce: ${nonce}" \
            -H "X-Signature-Algorithm: hmac-sha256" \
            -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-extract_completed-50" \
            -H "X-Partner-Signature: ${signature}" \
            -d "${payload}" >/tmp/activity_emit_extract_done_code.txt || true
          echo "[activity] extract_completed -> HTTP $(cat /tmp/activity_emit_extract_done_code.txt 2>/dev/null || echo '000')"

  aggregate:
    needs: [plan, extract]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Emit aggregate started event (safe-failure)
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          nonce="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          payload=$(cat <<JSON
          {"partner_request_id":"${REQUEST_ID}","event_key":"aggregate_started","sequence":60,"status":"processing","phase":"aggregating","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"event_at":"${timestamp}"}
          JSON
          )
          signature=""
          if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
            signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
            signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
          fi
          curl -sS -o /tmp/activity_emit_agg_start.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
            --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
            -H "X-Partner-Name: ${PARTNER_NAME}" \
            -H "X-Partner-Timestamp: ${timestamp}" \
            -H "X-Partner-Nonce: ${nonce}" \
            -H "X-Signature-Algorithm: hmac-sha256" \
            -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-aggregate_started-60" \
            -H "X-Partner-Signature: ${signature}" \
            -d "${payload}" >/tmp/activity_emit_agg_start_code.txt || true
          echo "[activity] aggregate_started -> HTTP $(cat /tmp/activity_emit_agg_start_code.txt 2>/dev/null || echo '000')"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download chunks
        uses: actions/download-artifact@v5
        with:
          path: chunks
          merge-multiple: true
      - name: "Preflight: list chunk CSVs"
        env:
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
        run: |
          set -euo pipefail
          echo "[preflight] SINGLE_CHUNK=${{ github.event.client_payload.single_chunk || 'true' }}"
          base="$(basename "${ORIGINAL_FILENAME:-document.pdf}")"
          base="${base%.*}"
          echo "[preflight] Base filename: $base"
          # Count CSVs matching the aggregator's pattern
          count=$(find chunks -type f -name "${base}-p*.csv" | wc -l | tr -d ' ')
          echo "[preflight] CSV chunk files found: $count"
          if [ "$count" -eq 0 ]; then
            echo "[preflight] No chunk CSV files found under ./chunks for base ${base}. Failing fast."
            # Show a quick tree for debugging
            find chunks -maxdepth 2 -type f | head -n 50 || true
            exit 1
          fi
          echo "[preflight] Sample of discovered CSVs:"
          find chunks -type f -name "${base}-p*.csv" | sort | head -n 20
      - name: "Preflight: connectivity check (5s timeout)"
        env:
          RESULT_UPLOAD_URL: ${{ github.event.client_payload.result_upload_url || 'https://extraction.peldargconsulting.com/api/github/upload-results' }}
          RESULT_UPLOAD_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://extraction.peldargconsulting.com/api/github/callback' }}
        run: |
          set -euo pipefail
          # Helper to run a short POST and only fail on connection errors/timeouts
          check_post() {
            local url="$1"; shift
            local extra_headers=("$@")
            echo "[preflight] Checking POST connectivity: ${url}"
            # Any HTTP code is fine; only a curl transport error should fail
            code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -m 5 --connect-timeout 5 \
                   -H "Content-Type: application/json" "${extra_headers[@]}" \
                   -d '{"preflight":true,"source":"github-actions"}' "$url" || echo "curl_error")
            if [ "$code" = "curl_error" ]; then
              echo "[preflight] Connection to ${url} failed (timeout or network error within 5s). Failing fast."
              exit 1
            fi
            echo "[preflight] ${url} responded HTTP ${code} (any code OK for reachability)."
          }
          # Upload endpoint (include Authorization header if token is set)
          if [ -n "${RESULT_UPLOAD_URL:-}" ]; then
            if [ -n "${RESULT_UPLOAD_TOKEN:-}" ]; then
              check_post "${RESULT_UPLOAD_URL}" -H "Authorization: Bearer ${RESULT_UPLOAD_TOKEN}"
            else
              check_post "${RESULT_UPLOAD_URL}"
            fi
          fi
          # Callback endpoint
          if [ -n "${CALLBACK_URL:-}" ]; then
            if [ -n "${RESULT_UPLOAD_TOKEN:-}" ]; then
              check_post "${CALLBACK_URL}" -H "Authorization: Bearer ${RESULT_UPLOAD_TOKEN}"
            else
              check_post "${CALLBACK_URL}"
            fi
          fi
      - name: Aggregate and upload (merge CSVs and XLSX only)
        env:
          ORIGINAL_FILENAME: ${{ github.event.client_payload.original_filename }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://extraction.peldargconsulting.com/api/github/callback' }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          RESULT_UPLOAD_URL: ${{ github.event.client_payload.result_upload_url || 'https://extraction.peldargconsulting.com/api/github/upload-results' }}
          RESULT_UPLOAD_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          CALLBACK_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          PAGE_START: ${{ github.event.client_payload.page_start }}
          PAGE_END: ${{ github.event.client_payload.page_end }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested }}
          AGG_SKIP_DOCX: 'true'
          AGG_MAX_DOCX_ROWS: 0
        run: |
          python scripts/aggregate_results.py
      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: outputs/*
          overwrite: true
      - name: Emit aggregate completed + callback sent events (safe-failure)
        if: ${{ success() }}
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          emit_activity() {
            local event_key="$1"; shift
            local sequence="$1"; shift
            local status="$1"; shift
            local phase="$1"; shift
            local timestamp nonce payload signature
            timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
            nonce="$(python - <<'PY'
            import uuid
            print(uuid.uuid4())
            PY
            )"
            payload=$(cat <<JSON
            {"partner_request_id":"${REQUEST_ID}","event_key":"${event_key}","sequence":${sequence},"status":"${status}","phase":"${phase}","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"event_at":"${timestamp}"}
            JSON
            )
            signature=""
            if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
              signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
              signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
            fi
            curl -sS -o /tmp/activity_emit_done.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
              --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
              -H "Content-Type: application/json" \
              -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
              -H "X-Partner-Name: ${PARTNER_NAME}" \
              -H "X-Partner-Timestamp: ${timestamp}" \
              -H "X-Partner-Nonce: ${nonce}" \
              -H "X-Signature-Algorithm: hmac-sha256" \
              -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${event_key}-${sequence}" \
              -H "X-Partner-Signature: ${signature}" \
              -d "${payload}" >/tmp/activity_emit_done_code.txt || true
            echo "[activity] ${event_key} -> HTTP $(cat /tmp/activity_emit_done_code.txt 2>/dev/null || echo '000')"
          }

          emit_activity "aggregate_completed" 70 "processing" "aggregate_completed"
          emit_activity "callback_sent" 80 "finalized" "completed"

  notify_failure:
    needs: [plan, extract, aggregate]
    if: ${{ always() && (needs.plan.result == 'failure' || needs.extract.result == 'failure' || needs.aggregate.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Emit failed lifecycle event (safe-failure)
        env:
          PARTNER_SHARED_TOKEN: ${{ secrets.PARTNER_SHARED_TOKEN }}
          PARTNER_SIGNATURE_SECRET: ${{ secrets.PARTNER_SIGNATURE_SECRET }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          USER_EMAIL: ${{ github.event.client_payload.user_email }}
          EXTRACTION_TYPE: ${{ github.event.client_payload.extraction_type || 'convocation' }}
          PAGES_REQUESTED: ${{ github.event.client_payload.pages_requested || 0 }}
        run: |
          set +e
          timestamp="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          nonce="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"
          payload=$(cat <<JSON
          {"partner_request_id":"${REQUEST_ID}","event_key":"failed","sequence":90,"status":"failed","phase":"failed","partner_name":"${PARTNER_NAME}","user_email":"${USER_EMAIL}","extraction_type":"${EXTRACTION_TYPE}","doc_id":"${DOC_ID}","run_id":"${GITHUB_RUN_ID}","pages_requested":${PAGES_REQUESTED},"failed_reason":"workflow_failed","event_at":"${timestamp}"}
          JSON
          )
          signature=""
          if [ -n "${PARTNER_SIGNATURE_SECRET:-}" ]; then
            signing_string=$(printf "POST\n%s\n%s\n%s\n%s" "${ACTIVITY_EVENTS_PATH}" "${timestamp}" "${nonce}" "${payload}")
            signature=$(printf '%s' "$signing_string" | openssl dgst -sha256 -hmac "${PARTNER_SIGNATURE_SECRET}" | awk '{print $2}')
          fi
          curl -sS -o /tmp/activity_emit_fail.txt -w "%{http_code}" -X POST "${ACTIVITY_EVENTS_URL}" \
            --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 5 --max-time 20 \
            -H "Content-Type: application/json" \
            -H "X-Partner-Token: ${PARTNER_SHARED_TOKEN}" \
            -H "X-Partner-Name: ${PARTNER_NAME}" \
            -H "X-Partner-Timestamp: ${timestamp}" \
            -H "X-Partner-Nonce: ${nonce}" \
            -H "X-Signature-Algorithm: hmac-sha256" \
            -H "Idempotency-Key: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-failed-90" \
            -H "X-Partner-Signature: ${signature}" \
            -d "${payload}" >/tmp/activity_emit_fail_code.txt || true
          echo "[activity] failed -> HTTP $(cat /tmp/activity_emit_fail_code.txt 2>/dev/null || echo '000')"
      - name: Send failed callback to app
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://extraction.peldargconsulting.com/api/github/callback' }}
          CALLBACK_HMAC_SECRET: ${{ secrets.CALLBACK_HMAC_SECRET }}
          CALLBACK_TOKEN: ${{ secrets.RESULT_UPLOAD_TOKEN }}
          DOC_ID: ${{ github.event.client_payload.doc_id }}
          REQUEST_ID: ${{ github.event.client_payload.request_id }}
        run: |
          set -euo pipefail
          if [ -z "${CALLBACK_URL:-}" ]; then
            echo "[notify_failure] CALLBACK_URL missing; skipping"
            exit 0
          fi

          reason="Workflow failed before successful aggregation/upload callback"
          payload=$(cat <<JSON
          {
            "status": "failed",
            "doc_id": "${DOC_ID}",
            "request_id": "${REQUEST_ID}",
            "failed_reason": "${reason}",
            "pages_processed": 0,
            "pages_with_results": 0,
            "files": {}
          }
          JSON
          )

          sig=""
          if [ -n "${CALLBACK_HMAC_SECRET:-}" ]; then
            sig=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$CALLBACK_HMAC_SECRET" | awk '{print $2}')
          fi

          auth_headers=()
          if [ -n "${CALLBACK_TOKEN:-}" ]; then
            auth_headers+=( -H "Authorization: Bearer ${CALLBACK_TOKEN}" )
            auth_headers+=( -H "X-Extractor-Token: ${CALLBACK_TOKEN}" )
          fi

          sig_headers=()
          if [ -n "$sig" ]; then
            sig_headers+=( -H "X-Extractor-Signature: ${sig}" )
          fi

          code=$(curl -sS -o /tmp/fail_callback_response.txt -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            "${auth_headers[@]}" \
            "${sig_headers[@]}" \
            -d "$payload" \
            "$CALLBACK_URL" || true)

          echo "[notify_failure] callback HTTP ${code}"
          cat /tmp/fail_callback_response.txt || true
